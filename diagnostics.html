<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kistefunn Diagnostikk</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f5f7;
      color: #172033;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 6px;
    }

    .sub {
      color: #667085;
      margin-bottom: 20px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: #172033;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .status {
      margin: 16px 0;
      padding: 14px;
      border-radius: 12px;
      background: white;
      border: 1px solid #ddd;
    }

    .log {
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 16px;
      margin: 10px 0;
      overflow-wrap: anywhere;
    }

    .error {
      border-left: 6px solid #c62828;
    }

    .ok {
      border-left: 6px solid #2e7d32;
    }

    .warn {
      border-left: 6px solid #b7791f;
    }

    .row {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 8px;
      margin: 4px 0;
    }

    .label {
      color: #667085;
      font-weight: 600;
    }

    code {
      background: #f0f1f3;
      padding: 2px 5px;
      border-radius: 5px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 2px;
      }
    }
  </style>
</head>

<body>
<main>
  <h1>🔧 Kistefunn Diagnostikk</h1>

  <div class="sub">
    Teknisk feillogg – viser de siste hendelsene fra backend.
  </div>

  <button id="refresh" type="button">
    Oppdater diagnostikk
  </button>

  <div id="status" class="status">
    Laster...
  </div>

  <div id="logs"></div>
</main>

<script>
  const statusEl = document.getElementById("status");
  const logsEl = document.getElementById("logs");
  const refreshBtn = document.getElementById("refresh");

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function formatDate(value) {
    if (!value) return "-";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return value;
    }

    return date.toLocaleString("no-NO");
  }

  function render(rows) {
    logsEl.innerHTML = "";

    if (!rows.length) {
      logsEl.innerHTML =
        '<div class="status">Ingen diagnostikkhendelser funnet.</div>';
      return;
    }

    for (const row of rows) {
      const level = String(row.level || "info").toLowerCase();

      const div = document.createElement("div");

      div.className =
        "log " +
        (level === "error"
          ? "error"
          : level === "warn"
            ? "warn"
            : "ok");

      div.innerHTML = `
        <div class="row">
          <div class="label">Tid</div>
          <div>${escapeHtml(formatDate(row.created_at))}</div>
        </div>

        <div class="row">
          <div class="label">Event-ID</div>
          <div><code>${escapeHtml(row.event_id)}</code></div>
        </div>

        <div class="row">
          <div class="label">Nivå</div>
          <div>${escapeHtml(row.level)}</div>
        </div>

        <div class="row">
          <div class="label">Steg</div>
          <div>${escapeHtml(row.stage)}</div>
        </div>

        <div class="row">
          <div class="label">Feilkode</div>
          <div><code>${escapeHtml(row.code || "-")}</code></div>
        </div>

        <div class="row">
          <div class="label">HTTP</div>
          <div>${escapeHtml(row.http_status ?? "-")}</div>
        </div>

        <div class="row">
          <div class="label">Backend</div>
          <div>${escapeHtml(row.backend_version || "-")}</div>
        </div>

        <div class="row">
          <div class="label">Modell</div>
          <div>${escapeHtml(row.model || "-")}</div>
        </div>

        <div class="row">
          <div class="label">Responstid</div>
          <div>${
            row.duration_ms != null
              ? escapeHtml(row.duration_ms + " ms")
              : "-"
          }</div>
        </div>

        <div class="row">
          <div class="label">Melding</div>
          <div>${escapeHtml(row.message || "-")}</div>
        </div>
      `;

      logsEl.appendChild(div);
    }
  }

  async function loadDiagnostics() {
    refreshBtn.disabled = true;
    statusEl.textContent = "Laster diagnostikk...";

    try {
      const response = await fetch("/api/diagnostics?limit=100", {
        cache: "no-store"
      });

      const data = await response.json();

      if (!response.ok || !data.ok) {
        throw new Error(
          data?.error?.message || "Kunne ikke hente diagnostikk."
        );
      }

      statusEl.textContent =
        `OK – ${data.count} hendelser. Diagnostikkversjon ${data.diagnostic_version}.`;

      render(data.rows || []);
    } catch (error) {
      statusEl.textContent =
        "❌ Diagnostikk kunne ikke hentes: " +
        (error?.message || String(error));

      logsEl.innerHTML = "";
    } finally {
      refreshBtn.disabled = false;
    }
  }

  refreshBtn.addEventListener("click", loadDiagnostics);

  loadDiagnostics();
</script>
</body>
</html>
