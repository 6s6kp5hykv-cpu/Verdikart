
name: Kistefunn Preview access check

on:
  push:
    branches:
      - Testrunner
    paths:
      - ".github/workflows/preview-access-check.yml"
      - "scripts/preview-access-check.sh"
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Vercel Preview URL (not production)"
        required: true
        default: "https://verdikartmvpiphone-le790hars-rehtmar.vercel.app"
        type: string

permissions:
  contents: read

jobs:
  check-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Testrunner
        uses: actions/checkout@v4

      - name: Check Preview access
        env:
          PREVIEW_URL: ${{ inputs.preview_url || 'https://verdikartmvpiphone-le790hars-rehtmar.vercel.app' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: bash scripts/preview-access-check.sh
