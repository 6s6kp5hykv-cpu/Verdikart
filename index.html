<script>
const items=JSON.parse(localStorage.getItem('vk_items')||'[]');
const wants=JSON.parse(localStorage.getItem('vk_wants')||'[]');
let current=null;

function show(id){
  ['scan','collection','wanted'].forEach(x=>{
    document.getElementById(x).classList.toggle('hidden',x!==id);
  });
  if(id==='collection')renderItems();
  if(id==='wanted')renderWants();
}

document.getElementById('photo').addEventListener('change',async e=>{
  const f=e.target.files[0];
  if(!f)return;

  const preview=document.getElementById('preview');
  const loading=document.getElementById('loading');
  const result=document.getElementById('result');

  result.classList.add('hidden');
  loading.classList.remove('hidden');

  try{
    const dataUrl=await fileToDataURL(f);

    preview.src=dataUrl;
    preview.classList.remove('hidden');

    const res=await fetch('/api/analyze',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:dataUrl})
    });

    const data=await res.json();

    if(!res.ok)throw new Error(data.error||'Kunne ikke analysere bildet');

    current={...data,img:dataUrl};

    document.getElementById('rname').textContent=
      data.name||'Ukjent gjenstand';

    document.getElementById('rdesc').textContent=
      data.description||'';

    const value=Number(data.estimated_value_nok);

    document.getElementById('rprice').textContent=
      !isNaN(value)&&data.estimated_value_nok!==null
      ? value.toLocaleString('no-NO')+' kr'
      : 'Verdi ikke fastslått';

    document.getElementById('rconfidence').textContent=
      'Identifiseringsikkerhet: '+(data.confidence||'ukjent');

    result.classList.remove('hidden');

  }catch(err){
    console.error(err);
    alert(err.message||'Det oppstod en feil.');
  }finally{
    loading.classList.add('hidden');
  }
});

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();

    img.onload=()=>{
      try{
        const max=1600;
        let w=img.naturalWidth;
        let h=img.naturalHeight;

        if(w>max||h>max){
          if(w>h){
            h=Math.round(h*max/w);
            w=max;
          }else{
            w=Math.round(w*max/h);
            h=max;
          }
        }

        const canvas=document.createElement('canvas');
        canvas.width=w;
        canvas.height=h;

        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);

        const data=canvas.toDataURL('image/jpeg',0.85);

        URL.revokeObjectURL(url);
        resolve(data);
      }catch(err){
        URL.revokeObjectURL(url);
        reject(err);
      }
    };

    img.onerror=()=>{
      URL.revokeObjectURL(url);
      reject(new Error('Kunne ikke lese bildet.'));
    };

    img.src=url;
  });
}

function saveCurrent(){
  if(!current)return;

  const value=Number(current.estimated_value_nok)||0;

  items.push({
    id:Date.now(),
    name:current.name||'Ukjent gjenstand',
    value:value,
    condition:current.condition||'Ukjent',
    img:current.img||'',
    history:[{
      date:new Date().toLocaleDateString('no-NO'),
      value:value
    }]
  });

  localStorage.setItem('vk_items',JSON.stringify(items));
  alert('Gjenstanden er lagret.');
  show('collection');
}

function renderItems(){
  document.getElementById('count').textContent=items.length;

  const total=items.reduce((s,x)=>s+(Number(x.value)||0),0);

  document.getElementById('total').textContent=
    total.toLocaleString('no-NO')+' kr';

  document.getElementById('items').innerHTML=items.length
    ?items.map(x=>`
      <div class="card item">
        <img class="thumb" src="${x.img||''}">
        <div style="flex:1">
          <b>${esc(x.name)}</b>
          <div class="price">${(Number(x.value)||0).toLocaleString('no-NO')} kr</div>
          <div class="muted">${esc(x.condition||'Ukjent')}</div>
        </div>
      </div>
    `).join('')
    :'<div class="card"><p>Samlingen er tom.</p></div>';
}

function saveWant(){
  const name=document.getElementById('wantName').value.trim();

  if(!name){
    alert('Skriv hva du ønsker å kjøpe.');
    return;
  }

  wants.push({
    name:name,
    price:Number(document.getElementById('wantPrice').value)||0,
    note:document.getElementById('wantNote').value
  });

  localStorage.setItem('vk_wants',JSON.stringify(wants));

  document.getElementById('wantName').value='';
  document.getElementById('wantPrice').value='';
  document.getElementById('wantNote').value='';

  renderWants();
}

function renderWants(){
  document.getElementById('wants').innerHTML=wants.length
    ?wants.map(w=>`
      <div class="card">
        <b>🔎 ${esc(w.name)}</b>
        <div>Opptil ${(Number(w.price)||0).toLocaleString('no-NO')} kr</div>
        <div class="muted">${esc(w.note||'Ingen kommentar')}</div>
      </div>
    `).join('')
    :'<div class="card"><p>Ingen kjøpsønsker ennå.</p></div>';
}

function esc(s){
  return String(s||'').replace(/[&<>"']/g,m=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[m]));
}

renderItems();
</script>
